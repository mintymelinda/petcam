name: Temporary camera formatting

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format-camera:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format camera dashboard
        run: npx --yes prettier@3.6.2 --write src/petcam/static/dashboard-camera.js
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Camera dashboard is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/petcam/static/dashboard-camera.js
          git commit -m "Format camera dashboard"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
