name: Raspberry Pi Image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raspberry-pi-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate deployment scripts and manifests
        run: |
          for script in \
            deploy/install.sh deploy/start.sh deploy/lib/dependencies.sh \
            deploy/image/assemble.sh \
            deploy/image/stages/stage-petcam/prerun.sh \
            deploy/image/stages/stage-petcam/01-petcam/00-run.sh \
            deploy/image/stages/stage-petcam/01-petcam/02-run-chroot.sh \
            tests/deploy/test_dependency_installer.sh; do
            bash -n "$script"
          done
          bash tests/deploy/test_dependency_installer.sh
          python3 -m unittest tests.infrastructure.system.test_deployment_assets tests.deploy.test_image_build tests.deploy.test_image_release_workflow

      - name: Validate Docker Compose configuration
        run: docker compose -f deploy/image/compose.yaml config --quiet

      - name: Assemble PetCam runtime with Docker Compose
        run: |
          mkdir -p deploy/image/dist
          docker compose -f deploy/image/compose.yaml run --build --rm assemble

      - name: Prepare pi-gen custom stage
        run: |
          source deploy/lib/dependencies.sh
          collect_feature_packages deploy/features > deploy/image/stages/stage-petcam/01-petcam/01-packages
          mkdir -p deploy/image/stages/stage-petcam/01-petcam/files
          install -m 0644 deploy/image/dist/petcam-runtime.tar.gz deploy/image/stages/stage-petcam/01-petcam/files/petcam-runtime.tar.gz
          test -s deploy/image/stages/stage-petcam/01-petcam/01-packages
          test -s deploy/image/stages/stage-petcam/01-petcam/files/petcam-runtime.tar.gz

      - name: Check out cache-enabled pi-gen action
        uses: actions/checkout@v5
        with:
          repository: usimd/pi-gen-action
          ref: d075c37c5eed90bf0325858ec2272e84200a5efe
          path: .github/actions/pi-gen-action
          persist-credentials: false

      - name: Set up Node.js for pi-gen action packaging
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Package cache-enabled pi-gen action
        working-directory: .github/actions/pi-gen-action
        run: |
          npm ci
          npm run package

      - name: Build Raspberry Pi OS image
        id: image
        # Build the pinned source revision because cache support is not in the v1.11.0 release.
        uses: ./.github/actions/pi-gen-action
        with:
          image-name: petcam
          hostname: petcam
          release: trixie
          pi-gen-version: arm64
          stage-list: stage0 stage1 stage2 ./deploy/image/stages/stage-petcam
          export-last-stage-only: true
          compression: xz
          enable-cloud-init: 0
          enable-ssh: 0
          username: petcam
          password: ''
          disable-first-boot-user-rename: 0
          locale: en_CA.UTF-8
          timezone: America/Toronto
          keyboard-keymap: us
          keyboard-layout: English (US)
          # Main refreshes the cache; PRs and other refs consume it without polluting it.
          enable-pigen-cache: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # pi-gen uses Git on the host to capture the source revision for its builder.
          extra-host-dependencies: git
          verbose-output: true

      - name: Validate generated image
        env:
          IMAGE_PATH: ${{ steps.image.outputs.image-path }}
        run: |
          test -n "$IMAGE_PATH"
          test -s "$IMAGE_PATH"
          xz -t "$IMAGE_PATH"

      - name: Upload validated image for release
        uses: actions/upload-artifact@v4
        with:
          name: petcam-image-${{ github.sha }}
          path: ${{ steps.image.outputs.image-path }}
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish production image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download validated image
        uses: actions/download-artifact@v4
        with:
          name: petcam-image-${{ github.sha }}
          path: release

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag $TAG must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Reusing existing release $TAG."
          else
            gh release create "$TAG" --draft --verify-tag --title "PetCam $VERSION" --generate-notes
          fi

      - name: Publish image and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          IMAGE_SOURCE="$(find release -maxdepth 2 -type f -name '*.img.xz' -print -quit)"
          if [[ -z "$IMAGE_SOURCE" || ! -s "$IMAGE_SOURCE" ]]; then
            echo "Validated image artifact is missing." >&2
            exit 1
          fi
          IMAGE_NAME="petcam-${TAG}-arm64.img.xz"
          cp "$IMAGE_SOURCE" "$IMAGE_NAME"
          xz -t "$IMAGE_NAME"
          sha256sum "$IMAGE_NAME" > "${IMAGE_NAME}.sha256"
          gh release upload "$TAG" "$IMAGE_NAME" "${IMAGE_NAME}.sha256" --clobber
          ASSETS="$(gh release view "$TAG" --json assets --jq '[.assets[].name]')"
          for REQUIRED_ASSET in "$IMAGE_NAME" "${IMAGE_NAME}.sha256"; do
            if ! jq -e --arg asset "$REQUIRED_ASSET" 'index($asset) != null' <<<"$ASSETS" >/dev/null; then
              echo "Release $TAG is missing required asset: $REQUIRED_ASSET" >&2
              exit 1
            fi
          done
          gh release edit "$TAG" --draft=false
