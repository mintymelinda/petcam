name: Raspberry Pi Image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raspberry-pi-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    # pi-gen's build container is i386; use an x86-64 host for both targets.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: armhf
            pi-gen-version: master
            artifact-name: petcam-image-armhf
          - architecture: arm64
            pi-gen-version: arm64
            artifact-name: petcam-image-arm64
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate deployment scripts and manifests
        if: matrix.architecture == 'armhf'
        run: |
          for script in \
            deploy/install.sh deploy/start.sh deploy/lib/dependencies.sh \
            deploy/image/assemble.sh \
            deploy/image/stages/stage-petcam/prerun.sh \
            deploy/image/stages/stage-petcam/01-petcam/00-run.sh \
            deploy/image/stages/stage-petcam/01-petcam/02-run-chroot.sh \
            tests/deploy/test_dependency_installer.sh; do
            bash -n "$script"
          done
          bash tests/deploy/test_dependency_installer.sh
          python3 -m unittest tests.infrastructure.system.test_deployment_assets tests.deploy.test_image_build tests.deploy.test_image_release_workflow tests.deploy.test_imager_manifest

      - name: Validate Docker Compose configuration
        run: docker compose -f deploy/image/compose.yaml config --quiet

      - name: Assemble PetCam runtime with Docker Compose
        run: |
          mkdir -p deploy/image/dist
          docker compose -f deploy/image/compose.yaml run --build --rm assemble

      - name: Prepare pi-gen custom stage
        run: |
          source deploy/lib/dependencies.sh
          collect_feature_packages deploy/features > deploy/image/stages/stage-petcam/01-petcam/01-packages
          mkdir -p deploy/image/stages/stage-petcam/01-petcam/files
          install -m 0644 deploy/image/dist/petcam-runtime.tar.gz deploy/image/stages/stage-petcam/01-petcam/files/petcam-runtime.tar.gz
          test -s deploy/image/stages/stage-petcam/01-petcam/01-packages
          test -s deploy/image/stages/stage-petcam/01-petcam/files/petcam-runtime.tar.gz

      # The upstream action's main branch contains TypeScript source; GitHub Actions
      # requires its dist/index.js entrypoint, so build that artifact from the live source.
      - name: Check out latest pi-gen action
        uses: actions/checkout@v5
        with:
          repository: usimd/pi-gen-action
          ref: main
          path: .github/actions/pi-gen-action
          persist-credentials: false

      - name: Package pi-gen action
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/actions/pi-gen-action/package-lock.json

      - name: Build pi-gen action entrypoint
        working-directory: .github/actions/pi-gen-action
        run: |
          npm ci
          npm run package

      - name: Build Raspberry Pi OS image
        id: image
        # pi-gen master is 32-bit ARMHF; its arm64 branch builds 64-bit ARM.
        uses: ./.github/actions/pi-gen-action
        with:
          image-name: petcam
          hostname: petcam
          release: trixie
          pi-gen-version: ${{ matrix.pi-gen-version }}
          stage-list: stage0 stage1 stage2 ./deploy/image/stages/stage-petcam
          export-last-stage-only: true
          compression: xz
          compression-level: 1
          enable-cloud-init: 1
          enable-ssh: 0
          username: petcam
          password: ''
          disable-first-boot-user-rename: 0
          locale: en_CA.UTF-8
          timezone: America/Toronto
          keyboard-keymap: us
          keyboard-layout: English (US)
          # Avoid sharing a work-directory cache between incompatible image architectures.
          enable-pigen-cache: false
          extra-host-dependencies: git
          verbose-output: true

      - name: Validate generated image
        env:
          IMAGE_PATH: ${{ steps.image.outputs.image-path }}
        run: |
          test -n "$IMAGE_PATH"
          test -s "$IMAGE_PATH"
          xz -t "$IMAGE_PATH"

      - name: Upload validated image for release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-${{ github.sha }}
          path: ${{ steps.image.outputs.image-path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-release:
    name: Publish production images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download validated ARMHF image
        uses: actions/download-artifact@v4
        with:
          name: petcam-image-armhf-${{ github.sha }}
          path: release/armhf

      - name: Download validated ARM64 image
        uses: actions/download-artifact@v4
        with:
          name: petcam-image-arm64-${{ github.sha }}
          path: release/arm64

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag $TAG must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Reusing existing release $TAG."
          else
            gh release create "$TAG" --draft --verify-tag --title "PetCam $VERSION" --generate-notes
          fi

      - name: Publish images, checksums, and Imager manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          ARMHF_SOURCE="$(find release/armhf -maxdepth 2 -type f -name '*.img.xz' -print -quit)"
          ARM64_SOURCE="$(find release/arm64 -maxdepth 2 -type f -name '*.img.xz' -print -quit)"
          if [[ -z "$ARMHF_SOURCE" || ! -s "$ARMHF_SOURCE" ]]; then
            echo "Validated ARMHF image artifact is missing." >&2
            exit 1
          fi
          if [[ -z "$ARM64_SOURCE" || ! -s "$ARM64_SOURCE" ]]; then
            echo "Validated ARM64 image artifact is missing." >&2
            exit 1
          fi
          ARMHF_NAME="petcam-${TAG}-armhf.img.xz"
          ARM64_NAME="petcam-${TAG}-arm64.img.xz"
          cp "$ARMHF_SOURCE" "$ARMHF_NAME"
          cp "$ARM64_SOURCE" "$ARM64_NAME"
          xz -t "$ARMHF_NAME"
          xz -t "$ARM64_NAME"
          sha256sum "$ARMHF_NAME" > "${ARMHF_NAME}.sha256"
          sha256sum "$ARM64_NAME" > "${ARM64_NAME}.sha256"
          ARMHF_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ARMHF_NAME}"
          ARM64_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ARM64_NAME}"
          python3 tools/create_imager_manifest.py \
            --armhf-image "$ARMHF_NAME" \
            --armhf-image-url "$ARMHF_URL" \
            --arm64-image "$ARM64_NAME" \
            --arm64-image-url "$ARM64_URL" \
            --release-date "$(date -u +%F)" \
            --output petcam-imager.json
          gh release upload "$TAG" "$ARMHF_NAME" "${ARMHF_NAME}.sha256" "$ARM64_NAME" "${ARM64_NAME}.sha256" petcam-imager.json --clobber
          ASSETS="$(gh release view "$TAG" --json assets --jq '[.assets[].name]')"
          for REQUIRED_ASSET in "$ARMHF_NAME" "${ARMHF_NAME}.sha256" "$ARM64_NAME" "${ARM64_NAME}.sha256" petcam-imager.json; do
            if ! jq -e --arg asset "$REQUIRED_ASSET" 'index($asset) != null' <<<"$ASSETS" >/dev/null; then
              echo "Release $TAG is missing required asset: $REQUIRED_ASSET" >&2
              exit 1
            fi
          done
          gh release edit "$TAG" --draft=false
