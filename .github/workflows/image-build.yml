name: Raspberry Pi Image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raspberry-pi-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    # pi-gen's build container is i386; use an x86-64 host for the ARMHF target.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate deployment scripts and manifests
        run: |
          for script in \
            deploy/install.sh deploy/start.sh deploy/lib/dependencies.sh \
            deploy/image/assemble.sh \
            deploy/image/stages/stage-petcam-apt-mirror/prerun.sh \
            deploy/image/stages/stage-petcam/prerun.sh \
            deploy/image/stages/stage-petcam/01-petcam/00-run.sh \
            deploy/image/stages/stage-petcam/01-petcam/02-run-chroot.sh \
            tests/deploy/test_dependency_installer.sh; do
            bash -n "$script"
          done
          bash tests/deploy/test_dependency_installer.sh
          python3 -m unittest tests.infrastructure.system.test_deployment_assets tests.deploy.test_image_build tests.deploy.test_image_release_workflow tests.deploy.test_imager_manifest

      - name: Validate Docker Compose configuration
        run: docker compose -f deploy/image/compose.yaml config --quiet

      - name: Assemble PetCam runtime with Docker Compose
        env:
          PETCAM_VERSION: ${{ github.sha }}
        run: |
          mkdir -p deploy/image/dist
          docker compose -f deploy/image/compose.yaml run --build --rm assemble

      - name: Prepare pi-gen custom stage
        run: |
          source deploy/lib/dependencies.sh
          collect_feature_packages deploy/features > deploy/image/stages/stage-petcam/01-petcam/01-packages
          mkdir -p deploy/image/stages/stage-petcam/01-petcam/files
          install -m 0644 deploy/image/dist/petcam-runtime.tar.gz deploy/image/stages/stage-petcam/01-petcam/files/petcam-runtime.tar.gz
          test -s deploy/image/stages/stage-petcam/01-petcam/01-packages
          test -s deploy/image/stages/stage-petcam/01-petcam/files/petcam-runtime.tar.gz
          chmod 0755 deploy/image/stages/stage-petcam-apt-mirror/prerun.sh

      # The upstream action's main branch contains TypeScript source; GitHub Actions
      # requires its dist/index.js entrypoint, so build that artifact from the live source.
      - name: Check out latest pi-gen action
        uses: actions/checkout@v5
        with:
          repository: usimd/pi-gen-action
          ref: main
          path: .github/actions/pi-gen-action
          persist-credentials: false

      - name: Package pi-gen action
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/actions/pi-gen-action/package-lock.json

      - name: Build pi-gen action entrypoint
        working-directory: .github/actions/pi-gen-action
        run: |
          npm ci
          npm run package

      - name: Build Raspberry Pi OS image
        id: image
        # pi-gen master builds the single 32-bit ARMHF image for all supported Pi generations.
        uses: ./.github/actions/pi-gen-action
        with:
          image-name: petcam
          hostname: petcam
          release: trixie
          pi-gen-version: master
          stage-list: ./deploy/image/stages/stage-petcam-apt-mirror stage0 stage1 stage2 ./deploy/image/stages/stage-petcam
          export-last-stage-only: true
          compression: xz
          compression-level: 1
          enable-cloud-init: 1
          enable-ssh: 0
          username: petcam
          password: ''
          disable-first-boot-user-rename: 0
          locale: en_CA.UTF-8
          timezone: America/Toronto
          keyboard-keymap: us
          keyboard-layout: English (US)
          # Keep the pi-gen work-directory cache disabled for a clean single-architecture build.
          enable-pigen-cache: false
          extra-host-dependencies: git
          verbose-output: true

      - name: Validate generated image
        env:
          IMAGE_PATH: ${{ steps.image.outputs.image-path }}
        run: |
          test -n "$IMAGE_PATH"
          test -s "$IMAGE_PATH"
          xz -t "$IMAGE_PATH"

      - name: Upload validated image for release
        uses: actions/upload-artifact@v4
        with:
          name: petcam-image-32bit-${{ github.sha }}
          path: ${{ steps.image.outputs.image-path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-release:
    name: Publish production image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download validated 32-bit image
        uses: actions/download-artifact@v4
        with:
          name: petcam-image-32bit-${{ github.sha }}
          path: release/image

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag $TAG must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Reusing existing release $TAG."
          else
            gh release create "$TAG" --draft --verify-tag --title "PetCam $VERSION" --generate-notes
          fi

      - name: Publish images, checksums, and Imager manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          IMAGE_SOURCE="$(find release/image -maxdepth 2 -type f -name '*.img.xz' -print -quit)"
          if [[ -z "$IMAGE_SOURCE" || ! -s "$IMAGE_SOURCE" ]]; then
            echo "Validated 32-bit image artifact is missing." >&2
            exit 1
          fi
          IMAGE_NAME="petcam-${TAG}-32bit.img.xz"
          cp "$IMAGE_SOURCE" "$IMAGE_NAME"
          xz -t "$IMAGE_NAME"
          sha256sum "$IMAGE_NAME" > "${IMAGE_NAME}.sha256"
          IMAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IMAGE_NAME}"
          python3 tools/create_imager_manifest.py \
            --image "$IMAGE_NAME" \
            --image-url "$IMAGE_URL" \
            --release-date "$(date -u +%F)" \
            --output petcam-imager.json
          gh release upload "$TAG" "$IMAGE_NAME" "${IMAGE_NAME}.sha256" petcam-imager.json --clobber
          ASSETS="$(gh release view "$TAG" --json assets --jq '[.assets[].name]')"
          for REQUIRED_ASSET in "$IMAGE_NAME" "${IMAGE_NAME}.sha256" petcam-imager.json; do
            if ! jq -e --arg asset "$REQUIRED_ASSET" 'index($asset) != null' <<<"$ASSETS" >/dev/null; then
              echo "Release $TAG is missing required asset: $REQUIRED_ASSET" >&2
              exit 1
            fi
          done
          gh release edit "$TAG" --draft=false
