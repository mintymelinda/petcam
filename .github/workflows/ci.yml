name: Application CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-javascript:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Prettier formatting for all shipped JavaScript
        run: |
          mapfile -t js_files < <(find src/petcam/static -maxdepth 1 -type f -name '*.js' -print | sort)
          if [ "${#js_files[@]}" -eq 0 ]; then
            echo "No shipped JavaScript assets found."
            exit 1
          fi
          npx --yes prettier@3.6.2 --check "${js_files[@]}"
      - name: Validate syntax for all shipped JavaScript
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src/petcam/static -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

  test:
    runs-on: ubuntu-24.04
    container:
      image: python:3.11-slim-bookworm
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir "Pillow>=10" "pytest>=8"
      - name: Validate deployment shell syntax
        run: bash -n deploy/install.sh deploy/lib/dependencies.sh tests/deploy/test_dependency_installer.sh
      - name: Test feature dependency discovery
        run: bash tests/deploy/test_dependency_installer.sh
      - name: Compile source and tests
        run: python -m compileall -q src tests tools
      - name: Enforce architecture boundaries
        run: python tools/check_architecture.py
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
