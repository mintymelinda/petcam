name: Application CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-javascript:
    permissions:
      contents: write
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format JavaScript with pinned Prettier
        run: npx --yes prettier@3.6.2 --write src/petcam/static/dashboard.js src/petcam/static/browser-source.js
      - name: Verify Prettier formatting
        run: npx --yes prettier@3.6.2 --check src/petcam/static/dashboard.js src/petcam/static/browser-source.js
      - name: Validate JavaScript syntax
        run: |
          node --check src/petcam/static/dashboard.js
          node --check src/petcam/static/browser-source.js
      - name: Commit formatting changes
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- src/petcam/static/dashboard.js src/petcam/static/browser-source.js; then
            echo "JavaScript is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/petcam/static/dashboard.js src/petcam/static/browser-source.js
          git commit -m "style: format external JavaScript assets"
          git push origin "HEAD:refs/heads/${PR_BRANCH}"

  test:
    runs-on: ubuntu-24.04
    container:
      image: python:3.11-slim-bookworm
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install application test dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir -e ".[test]"
      - name: Build and inspect Python wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("petcam-*.whl"))
          with ZipFile(wheel) as archive:
              files = set(archive.namelist())
          required = {
              "petcam/__init__.py",
              "petcam/static/dashboard.html",
              "petcam/static/dashboard.js",
              "petcam/static/browser-source.html",
              "petcam/static/browser-source.js",
          }
          missing = required - files
          if missing:
              raise SystemExit(f"Wheel is missing package files: {sorted(missing)}")
          PY
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m pytest -q
