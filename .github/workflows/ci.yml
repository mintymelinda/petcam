name: Application CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-javascript:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Prettier formatting for all shipped JavaScript
        run: |
          mapfile -t js_files < <(find src/petcam/static -maxdepth 1 -type f -name '*.js' -print | sort)
          if [ "${#js_files[@]}" -eq 0 ]; then
            echo "No shipped JavaScript assets found."
            exit 1
          fi
          npx --yes prettier@3.6.2 --check "${js_files[@]}"
      - name: Validate syntax for all shipped JavaScript
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src/petcam/static -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

  test:
    runs-on: ubuntu-24.04
    container:
      image: python:3.11-slim-bookworm
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install application test dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir -e .
          python -m pip install --no-cache-dir "pytest>=8"
      - name: Build and inspect Python wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("petcam-*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              files = set(names)
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode("utf-8")
          if not any(line.startswith("Requires-Dist: Pillow") for line in metadata.splitlines()):
              raise SystemExit("Wheel metadata does not declare Pillow as a runtime dependency.")
          required = {
              "petcam/__init__.py",
              "petcam/static/dashboard.html",
              "petcam/static/dashboard.js",
              "petcam/static/dashboard-api.js",
              "petcam/static/dashboard-core.js",
              "petcam/static/dashboard-camera.js",
              "petcam/static/dashboard-features.js",
              "petcam/static/browser-source.html",
              "petcam/static/browser-source.js",
          }
          missing = required - files
          if missing:
              raise SystemExit(f"Wheel is missing package files: {sorted(missing)}")
          PY
      - name: Compile source and tests
        run: python -m compileall -q src tests tools
      - name: Enforce architecture boundaries
        run: python tools/check_architecture.py
      - name: Run unit tests
        run: python -m pytest -q
