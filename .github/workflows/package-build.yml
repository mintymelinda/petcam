name: PetCam ARMHF Package

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: petcam-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate deployment scripts and architecture checks
        run: |
          for script in \
            deploy/install.sh deploy/start.sh deploy/lib/dependencies.sh \
            deploy/lib/platform.sh deploy/package/build.sh deploy/package/install.sh \
            tests/deploy/test_dependency_installer.sh tests/deploy/test_platform_validation.sh; do
            bash -n "$script"
          done
          bash tests/deploy/test_dependency_installer.sh
          bash tests/deploy/test_platform_validation.sh
          python3 -m unittest \
            tests.infrastructure.system.test_deployment_assets \
            tests.deploy.test_package_build
          python3 -m compileall -q src tests tools

      - name: Build the single ARMHF application package
        env:
          PETCAM_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
        run: |
          deploy/package/build.sh dist
          test -s dist/petcam-armhf.tar.gz
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          tar -tzf dist/petcam-armhf.tar.gz > dist/package-contents.txt
          grep -q '^./install.sh$' dist/package-contents.txt
          grep -q '^./deploy/lib/platform.sh$' dist/package-contents.txt
          ! grep -q '^./deploy/image/' dist/package-contents.txt

      - name: Upload ARMHF package
        uses: actions/upload-artifact@v4
        with:
          name: petcam-armhf-package-${{ github.sha }}
          path: dist/petcam-armhf.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-release:
    name: Publish production ARMHF package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download validated ARMHF package
        uses: actions/download-artifact@v4
        with:
          name: petcam-armhf-package-${{ github.sha }}
          path: release/package

      - name: Prepare and publish application release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag $TAG must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          PACKAGE_SOURCE="$(find release/package -maxdepth 2 -type f -name 'petcam-armhf.tar.gz' -print -quit)"
          if [[ -z "$PACKAGE_SOURCE" || ! -s "$PACKAGE_SOURCE" ]]; then
            echo "Validated ARMHF application package is missing." >&2
            exit 1
          fi
          cp "$PACKAGE_SOURCE" petcam-armhf.tar.gz
          sha256sum petcam-armhf.tar.gz > petcam-armhf.tar.gz.sha256

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Reusing existing release $TAG."
          else
            gh release create "$TAG" --draft --verify-tag --title "PetCam ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" petcam-armhf.tar.gz petcam-armhf.tar.gz.sha256 --clobber
          ASSETS="$(gh release view "$TAG" --json assets --jq '[.assets[].name]')"
          for REQUIRED_ASSET in petcam-armhf.tar.gz petcam-armhf.tar.gz.sha256; do
            if ! jq -e --arg asset "$REQUIRED_ASSET" 'index($asset) != null' <<<"$ASSETS" >/dev/null; then
              echo "Release $TAG is missing required asset: $REQUIRED_ASSET" >&2
              exit 1
            fi
          done
          gh release edit "$TAG" --draft=false
