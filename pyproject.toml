[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petcam"
dynamic = ["version"]
description = "Raspberry Pi camera streaming and management application"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = ["Pillow>=10"]

[project.scripts]
petcam-camera = "petcam.infrastructure.camera.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = { petcam = "src", "petcam.api" = "src/api", "petcam.application" = "src/application", "petcam.domain" = "src/domain", "petcam.domain.camera" = "src/domain/camera", "petcam.domain.motion" = "src/domain/motion", "petcam.domain.streaming" = "src/domain/streaming", "petcam.domain.timelapse" = "src/domain/timelapse", "petcam.features" = "src/features", "petcam.features.home_assistant" = "src/features/home_assistant", "petcam.features.light_sensor" = "src/features/light_sensor", "petcam.features.motion" = "src/features/motion", "petcam.features.timelapse" = "src/features/timelapse", "petcam.infrastructure" = "src/infrastructure", "petcam.infrastructure.camera" = "src/infrastructure/camera", "petcam.infrastructure.mqtt" = "src/infrastructure/mqtt", "petcam.infrastructure.network" = "src/infrastructure/network", "petcam.infrastructure.persistence" = "src/infrastructure/persistence", "petcam.infrastructure.streaming" = "src/infrastructure/streaming", "petcam.infrastructure.system" = "src/infrastructure/system", "petcam.security" = "src/security" }
packages = ["petcam", "petcam.api", "petcam.application", "petcam.domain", "petcam.domain.camera", "petcam.domain.motion", "petcam.domain.streaming", "petcam.domain.timelapse", "petcam.features", "petcam.features.home_assistant", "petcam.features.light_sensor", "petcam.features.motion", "petcam.features.timelapse", "petcam.infrastructure", "petcam.infrastructure.camera", "petcam.infrastructure.mqtt", "petcam.infrastructure.network", "petcam.infrastructure.persistence", "petcam.infrastructure.streaming", "petcam.infrastructure.system", "petcam.security"]

[tool.setuptools.package-data]
petcam = ["static/*.js", "static/*.html"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
