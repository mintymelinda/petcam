[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petcam"
dynamic = ["version"]
description = "Raspberry Pi camera streaming and management application"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = ["Pillow>=10"]

[project.scripts]
petcam-camera = "petcam.infrastructure.camera.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
petcam = ["static/*.js", "static/*.html"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
